<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
  </defs>

  <!-- Modern Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#innerGlow)" stroke-width="8" opacity="0.6" />

  <!-- Background decorative geometric wave -->
  <path d="M64 380 Q 180 320 256 360 T 448 310" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" stroke-linecap="round" />
  <path d="M64 420 Q 180 360 256 400 T 448 350" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.1" stroke-linecap="round" />

  <!-- Iconic 'M' Glyph - Architectural, bold, modern finance symbol -->
  <g filter="url(#glow)">
    <path 
      d="M120 376 V196 C120 180 134 168 150 168 C160 168 170 174 176 182 L256 288 L336 182 C342 174 352 168 362 168 C378 168 392 180 392 196 V376 C392 388 382 398 370 398 C358 398 348 388 348 376 V240 L278 334 C268 348 244 348 234 334 L164 240 V376 C164 388 154 398 142 398 C130 398 120 388 120 376 Z" 
      fill="url(#mGrad)" 
    />
  </g>

  <!-- Montra Sparkle (Upper Right) -->
  <g transform="translate(372, 108)">
    <path 
      d="M0 -42 C1 -12 12 -1 42 0 C12 1 1 12 0 42 C-1 12 -12 1 -42 0 C-12 -1 -1 -12 0 -42 Z" 
      fill="#fef08a" 
      opacity="0.95"
    />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Small accent sparkle (Left Middle) -->
  <g transform="translate(108, 140) scale(0.45)">
    <path 
      d="M0 -36 C1 -10 10 -1 36 0 C10 1 1 10 0 36 C-1 10 -10 1 -36 0 C-10 -1 -1 -10 0 -36 Z" 
      fill="#a7f3d0" 
      opacity="0.8"
    />
  </g>
</svg>
